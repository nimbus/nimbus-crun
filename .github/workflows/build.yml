name: Build nimbus-crun

on:
  pull_request:
    paths:
      - "patches/**"
      - "scripts/**"
      - "tests/**"
      - ".github/container/**"
      - ".github/workflows/build.yml"
  push:
    branches:
      - main
    tags:
      - "v1.29.1-nimbus.*"
    paths:
      - "patches/**"
      - "scripts/**"
      - "tests/**"
      - ".github/container/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CRUN_VERSION: "1.29.1"
  CRUN_SOURCE_COMMIT: "f0d911de5587342cfeb16473bf32ecdfeaf25957"
  FEDORA_IMAGE: "fedora:44"
  NIMBUS_CRUN_VERSION: "1.29.1-nimbus.1"
  NIMBUS_LIBKRUN_REPO: "nimbus/nimbus-libkrun"
  NIMBUS_LIBKRUN_VERSION: "v1.19.4-nimbus.1"
  NIMBUS_LIBKRUN_AMD64_SHA256: "752907cc3d41a23e9c70e57e47e5cf8c2421c1c735cda99c75752d1142099101"
  NIMBUS_LIBKRUN_ARM64_SHA256: "543be429cf4d57f978a3da9d74f53789653e4df6d2dbe42f6178e27abfb73589"
  NIMBUS_CRUN_RUNPATH: "$ORIGIN/lib"

jobs:
  verify:
    name: Verify patch and helpers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify helper script syntax and help entrypoints
        run: |
          bash -n scripts/verify-patch.sh
          bash -n scripts/verify-port-map-parser.sh
          bash -n scripts/build.sh
          bash -n scripts/verify-fedora-userspace.sh
          bash scripts/build.sh --help
          bash scripts/verify-fedora-userspace.sh --help

      - name: Verify release tag matches the embedded version
        if: github.ref_type == 'tag'
        run: |
          if [[ "${GITHUB_REF_NAME}" != "v${NIMBUS_CRUN_VERSION}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match v${NIMBUS_CRUN_VERSION}" >&2
            exit 1
          fi

      - name: Download pinned crun source
        run: |
          curl -fsSL -o crun.tar.gz \
            "https://github.com/containers/crun/archive/refs/tags/${CRUN_VERSION}.tar.gz"
          tar xzf crun.tar.gz

      - name: Verify patch applies cleanly
        run: bash scripts/verify-patch.sh "${{ github.workspace }}/crun-${CRUN_VERSION}"

  build:
    name: Build nimbus-crun (linux ${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Initialize build directories
        run: |
          {
            echo "CRUN_SOURCE_DIR=${RUNNER_TEMP}/crun-source"
            echo "BUILD_OUTPUT_DIR=${RUNNER_TEMP}/nimbus-crun-output"
            echo "BUILD_WORK_DIR=${RUNNER_TEMP}/nimbus-crun-build"
            echo "LIBKRUN_ARCHIVE_DIR=${RUNNER_TEMP}/nimbus-libkrun-release"
            echo "LIBKRUN_ROOT=${RUNNER_TEMP}/nimbus-libkrun-root"
          } >> "${GITHUB_ENV}"
          mkdir -p \
            "${RUNNER_TEMP}/crun-source" \
            "${RUNNER_TEMP}/nimbus-crun-output" \
            "${RUNNER_TEMP}/nimbus-crun-build" \
            "${RUNNER_TEMP}/nimbus-libkrun-release" \
            "${RUNNER_TEMP}/nimbus-libkrun-root"

      - name: Clone pinned crun source with submodules
        run: |
          git clone --depth 1 --branch "${CRUN_VERSION}" --recurse-submodules \
            https://github.com/containers/crun.git "${CRUN_SOURCE_DIR}"

          actual_commit="$(git -C "${CRUN_SOURCE_DIR}" rev-parse HEAD)"
          if [[ "${actual_commit}" != "${CRUN_SOURCE_COMMIT}" ]]; then
            echo "crun ${CRUN_VERSION} resolved to ${actual_commit}, expected ${CRUN_SOURCE_COMMIT}" >&2
            exit 1
          fi

      - name: Download paired nimbus-libkrun release
        run: |
          release_url="https://github.com/${NIMBUS_LIBKRUN_REPO}/releases/download/${NIMBUS_LIBKRUN_VERSION}"
          archive_name="nimbus-libkrun-linux-${{ matrix.arch }}.tar.gz"

          curl -fsSL -o "${LIBKRUN_ARCHIVE_DIR}/checksums.txt" \
            "${release_url}/checksums.txt"
          curl -fsSL -o "${LIBKRUN_ARCHIVE_DIR}/${archive_name}" \
            "${release_url}/${archive_name}"

          cd "${LIBKRUN_ARCHIVE_DIR}"
          case "${{ matrix.arch }}" in
            amd64) expected_sha256="${NIMBUS_LIBKRUN_AMD64_SHA256}" ;;
            arm64) expected_sha256="${NIMBUS_LIBKRUN_ARM64_SHA256}" ;;
            *) echo "unsupported architecture: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac

          printf '%s  %s\n' "${expected_sha256}" "${archive_name}" | sha256sum -c -
          grep -Fqx "${expected_sha256}  ${archive_name}" checksums.txt
          tar -xzf "${archive_name}" -C "${LIBKRUN_ROOT}"

      - name: Build cached builder image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/container/Dockerfile.builder
          build-args: |
            FEDORA_IMAGE=${{ env.FEDORA_IMAGE }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: nimbus-crun-builder:${{ matrix.arch }}
          cache-from: type=gha,scope=builder-${{ matrix.arch }}
          cache-to: type=gha,scope=builder-${{ matrix.arch }},mode=max

      - name: Build patched crun in builder image
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work/repo:ro" \
            -v "${CRUN_SOURCE_DIR}:/work/crun-src:ro" \
            -v "${LIBKRUN_ROOT}:/work/libkrun:ro" \
            -v "${BUILD_OUTPUT_DIR}:/work/output" \
            -v "${BUILD_WORK_DIR}:/work/build" \
            -e NIMBUS_CRUN_RUNPATH="${NIMBUS_CRUN_RUNPATH}" \
            -e NIMBUS_CRUN_VERSION="${NIMBUS_CRUN_VERSION}" \
            --workdir /work/repo \
            "nimbus-crun-builder:${{ matrix.arch }}" \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work/build
              bash scripts/verify-patch.sh /work/crun-src
              bash scripts/build.sh \
                --source /work/crun-src \
                --libkrun-root /work/libkrun \
                --release-version "${NIMBUS_CRUN_VERSION}" \
                --output /work/output/crun \
                --build-dir /work/build \
                --runpath "${NIMBUS_CRUN_RUNPATH}"

              echo "--- version check ---"
              LD_LIBRARY_PATH=/work/libkrun/lib /work/output/crun --version

              version_output="$(LD_LIBRARY_PATH=/work/libkrun/lib /work/output/crun --version)"
              if [[ "${version_output}" != *"+LIBKRUN"* ]]; then
                echo "ERROR: built crun binary does not have +LIBKRUN support" >&2
                exit 1
              fi
              readelf -d /work/output/crun
              echo "PASS: crun binary has +LIBKRUN support"
            '

      - name: Rename binary for release
        run: |
          mv "${BUILD_OUTPUT_DIR}/crun" "${BUILD_OUTPUT_DIR}/nimbus-crun-linux-${{ matrix.arch }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nimbus-crun-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ env.BUILD_OUTPUT_DIR }}/nimbus-crun-linux-${{ matrix.arch }}

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Prepare release assets
        id: release-assets
        run: |
          release_dir="${RUNNER_TEMP}/release"
          mkdir -p "${release_dir}"

          cp "${RUNNER_TEMP}/artifacts/nimbus-crun-linux-amd64/nimbus-crun-linux-amd64" "${release_dir}/"
          cp "${RUNNER_TEMP}/artifacts/nimbus-crun-linux-arm64/nimbus-crun-linux-arm64" "${release_dir}/"

          cd "${release_dir}"
          sha256sum nimbus-crun-linux-amd64 nimbus-crun-linux-arm64 > checksums.txt
          cat checksums.txt

          echo "release_dir=${release_dir}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ steps.release-assets.outputs.release_dir }}/nimbus-crun-linux-amd64
            ${{ steps.release-assets.outputs.release_dir }}/nimbus-crun-linux-arm64
            ${{ steps.release-assets.outputs.release_dir }}/checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="${{ steps.release-assets.outputs.release_dir }}"

          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "nimbus-crun ${{ github.ref_name }}" \
            --notes "$(cat <<'NOTES'
          Patched crun binary with libkrun TSI port mapping support.

          **Build:** crun 1.29.1 + `0001-krun-add-tsi-port-mapping-via-oci-annotation.patch`,
          linked against `nimbus/nimbus-libkrun` v1.19.4-nimbus.1.

          The binary includes `+LIBKRUN` support and reads the `krun.port_map` OCI
          annotation to configure TSI port forwarding via `krun_set_port_map()`
          or `krun_set_port_map_with_bind_address()`. Its RUNPATH is `$ORIGIN/lib`
          for the `/usr/libexec/nimbus/crun` + `/usr/libexec/nimbus/lib` install
          layout.

          **Verify:**
          ```bash
          sha256sum -c checksums.txt
          LD_LIBRARY_PATH=/usr/libexec/nimbus/lib /usr/libexec/nimbus/crun --version
          ```
          NOTES
          )" \
            "${release_dir}/nimbus-crun-linux-amd64" \
            "${release_dir}/nimbus-crun-linux-arm64" \
            "${release_dir}/checksums.txt"
